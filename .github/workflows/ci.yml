name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github --line-length=120

      - name: Format check with Ruff
        run: ruff format --check --diff --line-length=120

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ --junitxml=junit/test-results.xml --cov=sync --cov-report=xml --cov-report=html

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Pytest Results
          path: junit/test-results.xml
          reporter: java-junit

      - name: Report coverage in PR
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          pytest-xml-coverage-path: coverage.xml

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  status-check:
    needs: [ci, docker-build]
    if: always()
    uses: ./.github/workflows/_status-check.yml
    with:
      result: >-
        ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
            && 'failure' || 'success' }}
