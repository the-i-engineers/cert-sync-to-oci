name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements_dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github --line-length=120

      - name: Format check with Ruff
        run: ruff format --check --diff --line-length=120

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ --junitxml=junit/test-results.xml --cov=sync --cov-report=xml --cov-report=html

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Pytest Results
          path: junit/test-results.xml
          reporter: java-junit

      - name: Report coverage in PR
        uses: MishaKav/pytest-coverage-comment@d46d9d594f3e1d11008ed19939deb7a139b18751 # v1.11.1
        with:
          pytest-xml-coverage-path: coverage.xml

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-required:
    name: CI Required Check
    needs: [ci, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "CI did not succeed: ${{ needs.ci.result }}"
            exit 1
          fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then
            echo "Docker build did not succeed: ${{ needs.docker-build.result }}"
            exit 1
          fi
          echo "CI passed"

      - name: Job summary
        if: always()
        run: |
          {
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **CI result** | \`${{ needs.ci.result }}\` |"
            echo "| **Docker build result** | \`${{ needs.docker-build.result }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
