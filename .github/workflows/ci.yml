name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  ci:
    name: CI
    runs-on: ${{ vars.REPOSITORY_RUNNER }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github --line-length=120

      - name: Format check with Ruff
        run: ruff format --check --diff --line-length=120

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ --junitxml=junit/test-results.xml --cov=sync --cov-report=xml --cov-report=html

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Pytest Results
          path: junit/test-results.xml
          reporter: java-junit

      - name: Report coverage in PR
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451 # v1.7.2
        with:
          pytest-xml-coverage-path: coverage.xml

  ci-required:
    name: CI Required Check
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "CI did not succeed: ${{ needs.ci.result }}"
            exit 1
          fi
          echo "CI passed"

      - name: Job summary
        if: always()
        run: |
          {
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **CI result** | \`${{ needs.ci.result }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
