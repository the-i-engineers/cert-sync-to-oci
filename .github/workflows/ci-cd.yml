name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ${{ vars.REPOSITORY_RUNNER }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github --line-length=120

      - name: Format check with Ruff
        run: ruff format --check --diff --line-length=120

      - name: Test with pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ --junitxml=junit/test-results.xml --cov=sync --cov-report=xml --cov-report=html

      - name: Report test results
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Pytest Results
          path: junit/test-results.xml
          reporter: java-junit

      - name: Report coverage in PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451 # v1.7.2
        with:
          pytest-xml-coverage-path: coverage.xml

  ci-required:
    name: CI Required Check
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [[ "${{ needs.ci.result }}" != "success" ]]; then
            echo "CI did not succeed: ${{ needs.ci.result }}"
            exit 1
          fi
          echo "CI passed"

      - name: Job summary
        if: always()
        run: |
          {
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **CI result** | \`${{ needs.ci.result }}\` |"
            echo "| **Actor** | ${{ github.actor }} |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker
    needs: ci-required
    runs-on: ${{ vars.REPOSITORY_RUNNER }}
    timeout-minutes: 20
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ghcr.io/the-i-engineers/cert-sync-to-oci
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
